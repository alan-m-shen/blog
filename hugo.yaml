baseURL: https://alan-shen.com/
languageCode: en-us
title: Alan Shen
theme: ["PaperMod"]
disableKinds: ["RSS"]

markup:
  goldmark:
    renderer:
      unsafe: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  description: "Alan M. Shen’s personal website. Essays on law, literature, and ideas."
  author: Alan Shen
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: false
  disableSpecial1stPost: true
  disableScrollToTop: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon.png
    favicon32x32: /favicon.png
    apple_touch_icon: /favicon.png
    safari_pinned_tab: /favicon.svg

  label:
    text: "Alan Shen"

  # home-info mode
  homeInfoParams:
    Title: "Alan M. Shen"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page
